services:
  api:
    container_name: iformat-ai-api
    image: iformat-ai-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${IFORMAT_ENV_FILE:-.env.production}
    ports:
      - "8010:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
